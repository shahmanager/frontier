<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" width="960" height="256" font-family="'SF Mono',Consolas,Menlo,'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="128" rx="20" fill="url(#bg)"/>
  <!-- pixel-art flag / range marker, depth via stacked layers -->
  <g opacity="0.35">
    <rect x="22" y="26" width="9" height="9" fill="#22d3ee"/>
    <rect x="13" y="40" width="18" height="9" fill="#38bdf8" opacity="0.9"/>
    <rect x="4"  y="54" width="27" height="9" fill="#38bdf8" opacity="0.8"/>
    <rect x="4"  y="68" width="18" height="9" fill="#818cf8" opacity="0.7"/>
    <rect x="13" y="82" width="9" height="9" fill="#818cf8" opacity="0.6"/>
  </g>
  <!-- silhouette (behind) for depth -->
  <text x="52" y="97" fill="#334155" font-size="76" font-weight="700"
        letter-spacing="4" filter="url(#glow)">FRONTIER</text>
  <!-- main wordmark -->
  <text x="50" y="93" font-size="76" font-weight="700" letter-spacing="4"
        fill="url(#cyan)" textLength="330">FRONTIER</text>
  <!-- pixel block "lane" under wordmark: the frontier you climb -->
  <g>
    <rect x="52"  y="104" width="7" height="7" fill="#22d3ee" opacity="0.95"/>
    <rect x="59"  y="104" width="7" height="7" fill="#22d3ee" opacity="0.9"/>
    <rect x="66"  y="104" width="7" height="7" fill="#38bdf8" opacity="0.85"/>
    <rect x="73"  y="104" width="7" height="7" fill="#38bdf8" opacity="0.8"/>
    <rect x="80"  y="104" width="7" height="7" fill="#818cf8" opacity="0.75"/>
    <rect x="87"  y="104" width="7" height="7" fill="#818cf8" opacity="0.7"/>
    <rect x="94"  y="104" width="7" height="7" fill="#a78bfa" opacity="0.65"/>
    <rect x="101" y="104" width="7" height="7" fill="#a78bfa" opacity="0.6"/>
    <rect x="108" y="104" width="7" height="7" fill="#22d3ee" opacity="0.55"/>
    <rect x="115" y="104" width="7" height="7" fill="#38bdf8" opacity="0.5"/>
    <rect x="122" y="104" width="7" height="7" fill="#818cf8" opacity="0.45"/>
    <rect x="129" y="104" width="7" height="7" fill="#a78bfa" opacity="0.4"/>
    <rect x="136" y="104" width="7" height="7" fill="#22d3ee" opacity="0.35"/>
    <rect x="143" y="104" width="7" height="7" fill="#38bdf8" opacity="0.3"/>
    <rect x="150" y="104" width="7" height="7" fill="#818cf8" opacity="0.25"/>
    <rect x="157" y="104" width="7" height="7" fill="#a78bfa" opacity="0.2"/>
  </g>
  <!-- version pill, terminal style -->
  <rect x="384" y="22" width="76" height="22" rx="6" fill="#0ea5e9" opacity="0.18"/>
  <text x="392" y="38" font-size="13" fill="#7dd3fc" letter-spacing="1">v1.0</text>
  <!-- cursor block -->
  <rect x="412" y="16" width="10" height="16" fill="#22d3ee"/>
</svg>